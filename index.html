<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ベタ丸が12の質問からあなたの性格を推理し、ぴったりの漫画・小説・映画を紹介する診断サイト。">
<title>マンガ性格診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a comic "stage" — the ink spirit Betamaru on the left, its speech balloon on the right, answer panels below; halftone-dotted paper ground */
:root {
  --paper: #eef0f3;
  --panel: #ffffff;
  --ink: #15171c;
  --ink-soft: #4a4f5c;
  --tone: rgba(21, 23, 28, .09);
  --accent: #2346d6;
  --marker: #ffd43b;
  --on-marker: #15171c;
  --beta: #15171c;
  --eye: #ffffff;
  --t-est: #e5482f; --t-esf: #d98a12; --t-ent: #2346d6; --t-enf: #d6407d;
  --t-ist: #3d7a8c; --t-isf: #2f9a6a; --t-int: #5b3fa8; --t-inf: #8a5a3c;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16181d; --panel: #1f2229; --ink: #eceef2; --ink-soft: #a9afbd;
    --tone: rgba(236, 238, 242, .07); --accent: #8ea2ff; --marker: #ffd43b; --on-marker: #15171c;
    --beta: #0b0c0f; --eye: #ffffff;
    --t-est: #ff7a62; --t-esf: #f2b14a; --t-ent: #8ea2ff; --t-enf: #ff7fb0;
    --t-ist: #6cc3d8; --t-isf: #5fd09c; --t-int: #b29bff; --t-inf: #e0a27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16181d; --panel: #1f2229; --ink: #eceef2; --ink-soft: #a9afbd;
  --tone: rgba(236, 238, 242, .07); --accent: #8ea2ff; --marker: #ffd43b; --on-marker: #15171c;
  --beta: #0b0c0f; --eye: #ffffff;
  --t-est: #ff7a62; --t-esf: #f2b14a; --t-ent: #8ea2ff; --t-enf: #ff7fb0;
  --t-ist: #6cc3d8; --t-isf: #5fd09c; --t-int: #b29bff; --t-inf: #e0a27a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--tone) 1.2px, transparent 1.4px);
  background-size: 7px 7px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
.page { max-width: 780px; margin: 0 auto; display: grid; gap: 20px; }

.masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 30px; height: 30px; border: 3px solid var(--ink); background: var(--marker); display: grid; place-items: center; color: var(--on-marker); font-size: .9rem; transform: rotate(-6deg); }
.masthead small { color: var(--ink-soft); font-size: .8rem; letter-spacing: .08em; }

.panel {
  background: var(--panel);
  border: 3px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  padding: clamp(20px, 4vw, 32px);
  min-width: 0;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.3; }
h2 { font-size: clamp(1.3rem, 4vw, 1.7rem); }
p { margin: 0; }
.stack { display: grid; gap: 16px; }
.label { font-size: .78rem; letter-spacing: .14em; color: var(--ink-soft); font-weight: 700; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.btn {
  font: inherit; font-weight: 700; cursor: pointer;
  border: 3px solid var(--ink); background: var(--marker); color: var(--on-marker);
  padding: 12px 26px; box-shadow: 4px 4px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.ghost { background: var(--panel); color: var(--ink); }
.btn:focus-visible, .answer:focus-visible, .link-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.link-btn { font: inherit; font-size: .9rem; background: none; border: 0; color: var(--ink-soft); cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:disabled { visibility: hidden; }

/* ---- stage: Betamaru + balloon ---- */
.stage { display: grid; grid-template-columns: minmax(110px, 190px) 1fr; gap: clamp(12px, 3vw, 28px); align-items: center; }
@media (max-width: 520px) { .stage { grid-template-columns: 96px 1fr; } }
.beta { width: 100%; height: auto; display: block; overflow: visible; }
.beta .body { fill: var(--beta); stroke: var(--ink); stroke-width: 3; }
.beta .white { fill: var(--eye); }
.beta .pupil { fill: var(--beta); transition: transform .25s; }
.beta .nib { fill: var(--marker); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.beta .mouth, .beta .lid { fill: none; stroke: var(--eye); stroke-width: 4; stroke-linecap: round; }
.beta .cheek { fill: var(--t-enf); opacity: .8; }
.beta .face-happy, .beta .face-wow { display: none; }
.beta.is-happy .face-normal, .beta.is-wow .face-normal { display: none; }
.beta.is-happy .face-happy { display: inline; }
.beta.is-wow .face-wow { display: inline; }
.beta.is-think .pupil { transform: translate(4px, -6px); }
.beta.is-think .mouth-n { d: path("M86 128 q8 -2 16 0"); }
.bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
.is-think .bob { animation: shake .5s ease-in-out infinite; }
@keyframes shake { 0%, 100% { transform: rotate(-2deg) } 50% { transform: rotate(2deg) } }
.sweat { fill: var(--accent); opacity: 0; }
.is-think .sweat { opacity: .85; }

.balloon {
  position: relative; background: var(--panel); border: 3px solid var(--ink);
  border-radius: 28px; padding: 20px clamp(18px, 4vw, 28px); min-width: 0;
  box-shadow: 5px 5px 0 var(--ink);
}
.balloon::before {
  content: ""; position: absolute; left: -17px; top: 42%; width: 22px; height: 22px;
  background: var(--panel); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  transform: rotate(45deg) skew(12deg, 12deg);
}
.speaker { font-size: .78rem; font-weight: 700; letter-spacing: .12em; color: var(--ink-soft); margin-bottom: 4px; }
.say { font-weight: 700; font-size: clamp(1.05rem, 3.4vw, 1.3rem); line-height: 1.6; min-height: 3.2em; }
.say.big { font-family: var(--f-display); font-weight: 400; }
.caret { display: inline-block; width: .5em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }

/* ---- quiz ---- */
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.qno { font-family: var(--f-display); font-size: 1.05rem; }
.qno em { font-style: normal; color: var(--ink-soft); font-size: .85rem; font-family: var(--f-body); margin-left: 6px; }
.progress { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.progress i { height: 10px; border: 2px solid var(--ink); background: var(--panel); }
.progress i.done { background: var(--ink); }
.progress i.now { background: var(--marker); }

.answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 600px) { .answers { grid-template-columns: 1fr 1fr; } }
.answer {
  font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
  border: 3px solid var(--ink); background: var(--panel); padding: 14px 10px;
  box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .1s;
  display: grid; gap: 2px; justify-items: center;
}
.answer small { font-weight: 500; font-size: .72rem; color: var(--ink-soft); }
.answer:hover { background: var(--tone); }
.answer:active, .answer.picked { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); background: var(--marker); color: var(--on-marker); }
.answer.picked small { color: var(--on-marker); }
.answers.locked .answer { pointer-events: none; }

/* ---- intro ---- */
.shelf-strip { display: flex; gap: 6px; overflow: hidden; height: 120px; align-items: flex-end; }
.mini-spine {
  flex: 0 0 auto; width: 30px; border: 2px solid var(--ink); background: var(--c);
  color: var(--panel); writing-mode: vertical-rl; font-size: .72rem; font-weight: 700;
  padding: 8px 0; overflow: hidden; white-space: nowrap; letter-spacing: .04em;
}
.fine { font-size: .82rem; color: var(--ink-soft); }

/* ---- result ---- */
.type-card { border-top: 14px solid var(--c); }
.kicker { font-size: .85rem; font-weight: 700; letter-spacing: .1em; color: var(--c); }
.typename { font-size: clamp(2rem, 7.5vw, 3.2rem); }
.catch { font-weight: 700; font-size: 1.05rem; }
.lede { color: var(--ink-soft); max-width: 38em; }

.deduce { display: grid; gap: 18px; }
.clue { display: grid; gap: 6px; }
.clue-q { font-size: .9rem; }
.clue-q b { background: linear-gradient(transparent 58%, var(--marker) 58%); }
.meter { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; font-size: .78rem; }
.meter span:nth-child(3) { text-align: right; }
.meter .meter-track { grid-column: 1 / -1; grid-row: 2; }
.meter span.win { font-weight: 700; color: var(--ink); }
.meter span { color: var(--ink-soft); }
.meter-track { position: relative; height: 14px; border: 2px solid var(--ink); background: var(--panel); }
.meter-track::after { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; border-left: 2px dashed var(--ink-soft); }
.meter-dot { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--c); border: 2px solid var(--ink); transition: left .7s ease-out; }
.clue-why { font-size: .88rem; color: var(--ink-soft); }

.book { border: 3px solid var(--ink); background: var(--panel); display: grid; grid-template-columns: 56px 1fr; min-width: 0; }
.book.hero-book { grid-template-columns: 76px 1fr; box-shadow: 6px 6px 0 var(--c); }
.spine {
  background: var(--c); border-right: 3px solid var(--ink); color: var(--panel);
  writing-mode: vertical-rl; font-family: var(--f-display); font-size: .95rem;
  display: flex; align-items: center; padding: 12px 0; letter-spacing: .08em;
  overflow: hidden; white-space: nowrap;
}
.hero-book .spine { font-size: 1.2rem; }
.book-body { padding: 16px 18px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.book-body h3 { font-size: 1.15rem; }
.hero-book .book-body h3 { font-size: clamp(1.4rem, 5vw, 1.9rem); }
.author { font-size: .82rem; color: var(--ink-soft); }
.tag { justify-self: start; font-size: .72rem; font-weight: 700; border: 2px solid var(--ink); background: var(--marker); color: var(--on-marker); padding: 1px 8px; }
.why { font-size: .93rem; }
.app-tag { justify-self: start; font-size: .72rem; font-weight: 700; border: 2px solid var(--c); color: var(--ink); padding: 1px 8px; }
.book-body a { font-size: .8rem; color: var(--accent); font-weight: 700; text-underline-offset: 3px; justify-self: start; }
.more { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.copied { font-size: .85rem; color: var(--ink-soft); }

.fade-in { animation: fade .28s ease-out; }
@keyframes fade { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade-in, .bob, .is-think .bob, .caret { animation: none; }
  .btn, .answer, .meter-dot, .beta .pupil { transition: none; }
}
footer { text-align: center; font-size: .78rem; color: var(--ink-soft); }
</style>

</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="logo"><span class="logo-mark">漫</span>マンガ性格診断</div>
    <small>全12問・約2分</small>
  </header>
  <main id="app"></main>
  <footer>受賞・ノミネート歴は「マンガ大賞」「このマンガがすごい!」（宝島社）「次にくるマンガ大賞」の発表に基づきます。アプリの連載状況は2026年10月時点で確認したものです。</footer>
</div>

<script>
// ---------- Betamaru (the ink spirit) ----------
const BETA_SVG = `
<svg class="beta" viewBox="0 0 190 200" role="img" aria-label="ベタ丸">
  <g class="bob">
    <path class="nib" d="M95 6 L112 40 L95 52 L78 40 Z"/>
    <path d="M95 22 L95 40" stroke="var(--ink)" stroke-width="3"/>
    <path class="body" d="M95 44 C60 70 22 100 22 138 C22 172 55 194 95 194 C135 194 168 172 168 138 C168 100 130 70 95 44 Z"/>
    <path class="sweat" d="M150 92 q8 12 0 18 q-8 -6 0 -18 z"/>
    <g class="face-normal">
      <ellipse class="white" cx="72" cy="118" rx="15" ry="18"/>
      <ellipse class="white" cx="118" cy="118" rx="15" ry="18"/>
      <circle class="pupil" cx="74" cy="122" r="7"/>
      <circle class="pupil" cx="116" cy="122" r="7"/>
      <path class="mouth mouth-n" d="M84 148 q11 9 22 0"/>
    </g>
    <g class="face-happy">
      <path class="lid" d="M60 120 q12 -14 24 0"/>
      <path class="lid" d="M106 120 q12 -14 24 0"/>
      <path class="mouth" d="M78 142 q17 20 34 0 z" fill="var(--eye)"/>
    </g>
    <g class="face-wow">
      <circle class="white" cx="72" cy="116" r="19"/>
      <circle class="white" cx="118" cy="116" r="19"/>
      <circle class="pupil" cx="72" cy="116" r="5"/>
      <circle class="pupil" cx="118" cy="116" r="5"/>
      <ellipse class="mouth" cx="95" cy="154" rx="7" ry="9"/>
    </g>
    <circle class="cheek" cx="52" cy="146" r="7"/>
    <circle class="cheek" cx="138" cy="146" r="7"/>
  </g>
</svg>`;

// ---------- axes ----------
// Each axis has two poles; a question's `yes` names the pole that "はい" pushes toward.
const AXES = {
  energy: { label: "元気の充電方法", poles: { E: "人と会って充電", I: "ひとりで充電" } },
  sense:  { label: "情報の受け取り方", poles: { S: "目の前の事実", N: "頭の中のイメージ" } },
  judge:  { label: "決めるときの軸", poles: { T: "筋道・理屈", F: "気持ち・関係" } }
};

// 30 candidates: 10 per axis, 5 whose "はい" leans each way. Each run draws 2 + 2 per axis.
const POOL = [
  // energy — はい → ひとり
  { q: "飲み会の帰り道、ひとりになった瞬間にほっとする。", axis: "energy", yes: "I",
    why: "人といる時間に気力を「使う」人ほど、ひとりになった瞬間の解放感が大きくなる。",
    whyNo: "人と過ごしたあとも元気が残っているのは、人との時間で充電できる人じゃ。" },
  { q: "休日、誰とも話さなかったけれど満足だった、という日がある。", axis: "energy", yes: "I",
    why: "沈黙が「さみしい」ではなく「満たされる」なら、君の電池はひとりの時間で溜まる。",
    whyNo: "誰とも話さない日が物足りないなら、君の電池は人との時間で溜まる。" },
  { q: "電話が鳴ると、出る前に少し身構える。", axis: "energy", yes: "I",
    why: "予告なしの会話に身構えるのは、人とのやりとりに気力を使う人じゃ。",
    whyNo: "突然の電話も平気なのは、人と話すことで元気が出る人じゃな。" },
  { q: "カフェでは、壁ぎわやすみの席を選びがち。", axis: "energy", yes: "I",
    why: "背中が守られた席が落ち着くのは、自分だけの空間で充電する人の本能じゃ。",
    whyNo: "真ん中の席でも落ち着けるのは、人の気配がむしろ心地よい人じゃ。" },
  { q: "楽しかった旅行のあと、ひとりでぼーっとする日がほしくなる。", axis: "energy", yes: "I",
    why: "楽しい時間ほど電池を使う。それを取り戻す日が要るのは、ひとり充電タイプの典型じゃ。",
    whyNo: "楽しい余韻のまま次の予定を入れられるのは、人で充電できる人じゃ。" },
  // energy — はい → 人
  { q: "旅行の写真を見返すと、景色より人が写っているものが多い。", axis: "energy", yes: "E",
    why: "カメラを向ける先は、心が動く先。人を撮る人は、人から元気をもらっておる。",
    whyNo: "景色を撮りたくなる人は、人の輪よりひとりで味わう時間に心が動いておる。" },
  { q: "レジで店員さんと、つい一言世間話をしてしまう。", axis: "energy", yes: "E",
    why: "用事のない会話を自然に楽しめるのは、人とのやりとりが充電になっている人じゃ。",
    whyNo: "用事のない会話をしないのは、人とのやりとりで気力を使う人の自然な選択じゃ。" },
  { q: "考えごとは、誰かに話しているうちにまとまることが多い。", axis: "energy", yes: "E",
    why: "話しながら考えがまとまるのは、人とのやりとりで頭も心も動き出す人じゃ。",
    whyNo: "ひとりで考えをまとめてから話すのは、自分の内側で充電する人じゃな。" },
  { q: "予定のない週末が2回続くと、そわそわしてくる。", axis: "energy", yes: "E",
    why: "人と会わない時間が続くと落ち着かないのは、人が電池になっている証拠じゃ。",
    whyNo: "予定のない週末が続いても平気なのは、ひとりの時間で満たされる人じゃ。" },
  { q: "初めての集まりでも、気づけば自分から話しかけている。", axis: "energy", yes: "E",
    why: "知らない人にも自然に近づけるのは、人との出会いが充電になる人じゃ。",
    whyNo: "話しかけてもらうのを待つのは、人との時間に気力を使う人の自然な守り方じゃ。" },

  // sense — はい → イメージ
  { q: "シャワーを浴びていると、関係ないアイデアが急に浮かんでくる。", axis: "sense", yes: "N",
    why: "目や手がふさがっているときに頭が勝手に連想を始めるのは、イメージで考える人の特徴じゃ。",
    whyNo: "頭が勝手に連想を始めない人は、目の前の現実にしっかり足をつけておる。" },
  { q: "天井のシミや雲が、顔や動物に見えてくることがよくある。", axis: "sense", yes: "N",
    why: "ただの模様に意味を見つけてしまうのは、想像のスイッチが入りやすい頭の持ち主じゃ。",
    whyNo: "模様は模様に見える人は、想像より目の前の事実を信じる頭の持ち主じゃ。" },
  { q: "考えごとをしながら歩いていて、曲がる角を通り過ぎたことがある。", axis: "sense", yes: "N",
    why: "頭の中の世界に入り込みやすいのは、イメージで考える人の特徴じゃ。",
    whyNo: "考えごとをしていても周りが見えているのは、目の前の事実をつかむ人じゃ。" },
  { q: "人の話を聞きながら、話と関係ない「もしも」をつい考えてしまう。", axis: "sense", yes: "N",
    why: "話の先や横へ連想が飛んでいくのは、イメージで考える頭じゃな。",
    whyNo: "話をそのまま正確に受け取れるのは、事実を大事にする人じゃ。" },
  { q: "初対面の人の名前より、そのときの雰囲気のほうをよく覚えている。", axis: "sense", yes: "N",
    why: "情報より空気ごと記憶するのは、全体をイメージでつかむ人じゃ。",
    whyNo: "名前をきちんと覚えているのは、具体的な手がかりで記憶する人じゃ。" },
  // sense — はい → 事実
  { q: "道を教えるときは「2つ目の信号を右、青い看板の店」のように具体的に伝える。", axis: "sense", yes: "S",
    why: "目印や数で伝える人は、世界を「実際に見えるもの」で記憶しておるんじゃ。",

// Questions for the current run; drawn fresh each time the quiz starts.
let QUESTIONS = [];
const SEEN_KEY = "manga-shindan-seen";

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Per axis: 2 questions whose "はい" leans each way, preferring ones not shown last time.
// Order is interleaved energy → sense → judge so every axis fills up evenly.
function drawQuestions() {
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) {}
  const fresh = q => !seen.includes(q.q);
  const perAxis = Object.keys(AXES).map(axis => {
    const picks = Object.keys(AXES[axis].poles).flatMap(pole => {
      const group = shuffle(POOL.filter(q => q.axis === axis && q.yes === pole));
      return [...group.filter(fresh), ...group.filter(q => !fresh(q))].slice(0, 2);
    });
    return shuffle(picks);
  });
  QUESTIONS = [0, 1, 2, 3].flatMap(i => perAxis.map(list => list[i]));
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(QUESTIONS.map(q => q.q))); } catch (e) {}
}

         movie: { title: "横道世之介", by: "沖田修一監督・2013年", why: "お人好しな大学生・世之介と過ごした日々を、周りの人たちが思い出す。いるだけで周りを明るくする人の物語です。" } },
  ENT: { novel: { title: "虐殺器官", by: "伊藤計劃", why: "世界各地で虐殺が起きる近未来、その裏にいる謎の男を追う軍人の物語。「もしも」を極限まで突き詰めたSFの傑作です。" },
         movie: { title: "プライマー", by: "シェーン・カルース監督・2004年", why: "ガレージで発明をしていた技術者たちが、偶然とんでもない装置を作ってしまう。何度も見返して仕組みを解きたくなる一本。" } },
  ENF: { novel: { title: "精霊の守り人", by: "上橋菜穂子", why: "女用心棒バルサが、命を狙われる皇子を守って旅をする。作り込まれた異世界と、人を守る強さに心が震えます。" },
         movie: { title: "はじまりのうた", by: "ジョン・カーニー監督・2013年", why: "どん底の音楽プロデューサーとシンガーソングライターが、ニューヨークの街角でアルバムを録り始める。作る楽しさがはじける映画です。" } },
  IST: { novel: { title: "羊と鋼の森", by: "宮下奈都", why: "ピアノの調律師を目指す青年が、音という見えないものを少しずつ聴き分けていく。細部に宿るものを信じる人の物語です。" },
         movie: { title: "パターソン", by: "ジム・ジャームッシュ監督・2016年", why: "バス運転手のパターソンは、毎日同じ道を走りながらノートに詩を書く。くり返しの中にある小さな違いを見つける映画です。" } },
  ISF: { novel: { title: "ツバキ文具店", by: "小川糸", why: "鎌倉で手紙の代筆を請け負う女性のもとに、さまざまな想いが持ち込まれる。言葉にしにくい気持ちをすくい上げる話です。" },
         movie: { title: "かもめ食堂", by: "荻上直子監督・2006年", why: "ヘルシンキで小さな食堂を開いた日本人女性と、そこに集まる人たち。おにぎりとコーヒーの湯気のような、静かな幸せの映画です。" } },
  INT: { novel: { title: "あなたの人生の物語", by: "テッド・チャン", why: "言語、数学、神の存在など、思考実験のようなテーマを描く短編集。読み終えたあとに世界の見え方が少し変わります。" },
         movie: { title: "十二人の怒れる男", by: "シドニー・ルメット監督・1957年", why: "一室にこもった陪審員12人が、少年の有罪・無罪を議論する。ひとりの「本当にそうか？」から議論がひっくり返っていきます。" } },
  INF: { novel: { title: "家守綺譚", by: "梨木香歩", why: "亡き友の家を守る物書きのもとに、河童や狸、サルスベリの木の想いが訪れる。夢と現実の境目がやわらかい物語です。" },
         movie: { title: "はちどり", by: "キム・ボラ監督・2018年", why: "1994年のソウル、14歳の少女ウニの揺れる日々。説明しすぎない静かな映像に、言葉にならない感情が満ちています。" } }
};

const REACT = {
  2: ["ほうほう、即答じゃな。", "ふむ、やはりな。", "なるほどのう！"],
  1: ["ふむふむ……。", "なるほど、少しそうか。", "ほう。"],
  "-1": ["ほう、そっちか。", "ふむ……意外じゃ。", "なるほどのう。"],
  "-2": ["ほう、きっぱりじゃな！", "そう来たか。", "ふむ、覚えておこう。"]
};

// ---------- state & helpers ----------
const app = document.getElementById("app");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let answers = [];
let typingTimer = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cvar = key => `--c: var(${TYPES[key].color})`;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function render(html) {
  clearTimeout(typingTimer);
  app.innerHTML = html;
  app.firstElementChild?.classList.add("fade-in");
}

function stage(mood, text, big = false) {
  return `
    <section class="panel stage">
      <div class="beta-wrap" data-mood="${mood}">${BETA_SVG}</div>
      <div class="balloon">
        <div class="speaker">ベタ丸</div>
        <p class="say${big ? " big" : ""}" id="say" data-text="${esc(text)}"></p>
      </div>
    </section>`;
}

function setMood(mood) {
  const svg = app.querySelector(".beta");
  if (!svg) return;
  svg.classList.remove("is-think", "is-happy", "is-wow");
  if (mood !== "normal") svg.classList.add("is-" + mood);
}

function type(text) {
  const el = document.getElementById("say");
  if (!el) return;
  clearTimeout(typingTimer);
  if (reduceMotion) { el.textContent = text; return; }
  let n = 0;
  const tick = () => {
    el.innerHTML = esc(text.slice(0, n)) + (n < text.length ? '<span class="caret">▍</span>' : "");
    if (n++ < text.length) typingTimer = setTimeout(tick, 28);
  };
  tick();
}

function boot(mood) {
  setMood(mood);
  const say = document.getElementById("say");
  if (say) type(say.dataset.text);
  window.scrollTo({ top: 0 });
}

// ---------- screens ----------
function intro() {
  answers = [];
  const all = Object.entries(TYPES).flatMap(([k, t]) => t.books.map(b => ({ k, title: b.title })));
  render(`
    <div class="stack">
      ${stage("normal", "わしはベタ丸。12の質問で、君にぴったりの一冊を当ててみせよう。")}
      <section class="panel stack">
        <div class="row">
          <button class="btn" id="start" type="button">ベタ丸の質問に答える</button>
          <span class="fine">4択・12問。質問は毎回変わるぞ。</span>
        </div>
      </section>
      <section class="panel stack">
        <div class="label">ベタ丸の本棚 ｜ 8タイプ × 3作品</div>
        <div class="shelf-strip" aria-hidden="true">
          ${all.map((b, i) => `<div class="mini-spine" style="${cvar(b.k)}; height:${78 + (i * 37 % 40)}px">${esc(b.title)}</div>`).join("")}
        </div>
        <p class="fine">誰もが知る大ヒット作はあえて外しました。マンガ大賞・このマンガがすごい!・次にくるマンガ大賞の受賞作やノミネート作、そして読み手の間で評価の高い作品から選んでいます。結果では、少年ジャンプ+・マガポケで連載中の作品と、同じタイプに合う小説・映画も紹介します。</p>
      </section>
    </div>`);
  boot("normal");
  document.getElementById("start").onclick = () => { drawQuestions(); question(0, "では第1問。深く考えず、パッと答えるのじゃぞ。"); };
}

function question(i, lead) {
  const Q = QUESTIONS[i];
  const text = (lead ? lead + "\n" : "") + Q.q;
  render(`
    <div class="stack">
      ${stage(i === 0 ? "normal" : "think", Q.q)}
      <section class="panel stack">
        <div class="qhead">
          <span class="qno">質問 ${i + 1}<em>/ ${QUESTIONS.length}</em></span>
          <button class="link-btn" id="back" type="button" ${i === 0 ? "disabled" : ""}>← ひとつ戻る</button>
        </div>
        <div class="progress" aria-hidden="true">
          ${QUESTIONS.map((_, j) => `<i class="${j < i ? "done" : j === i ? "now" : ""}"></i>`).join("")}
        </div>
        <div class="answers" id="answers">
          ${ANSWERS.map((a, j) => `
            <button class="answer${answers[i] === j ? " picked" : ""}" type="button" data-j="${j}">
              <span>${a.label}</span><small>${a.sub}</small>
            </button>`).join("")}
        </div>
      </section>
    </div>`);
  boot("normal");
  if (lead) {
    const el = document.getElementById("say");
    el.dataset.text = text;
    el.style.whiteSpace = "pre-line";
    type(text);
  }
  document.getElementById("back").onclick = () => question(i - 1, "よし、戻ろう。");
  document.querySelectorAll(".answer").forEach(btn => btn.onclick = () => {
    const j = +btn.dataset.j;
    answers[i] = j;
    answers.length = i + 1;
    btn.classList.add("picked");
    document.getElementById("answers").classList.add("locked");
    setMood(Math.abs(ANSWERS[j].w) === 2 ? "wow" : "think");
    const next = i + 1;
    if (next >= QUESTIONS.length) { setTimeout(thinking, 380); return; }
    setTimeout(() => question(next, hint(next) || pick(REACT[ANSWERS[j].w])), 380);
  });
}

// Mid-quiz teasers once each axis has a couple of answers.
function hint(next) {
  if (next !== 6 && next !== 9) return null;
  const s = axisScores();
  const key = next === 6 ? "energy" : "sense";
  const pole = leaning(key, s[key]);
  return `……見えてきたぞ。君は「${AXES[key].poles[pole]}」タイプの匂いがする。`;
}

function axisScores() {
  const s = { energy: 0, sense: 0, judge: 0 };
  const first = { energy: "E", sense: "N", judge: "F" };
  answers.forEach((j, i) => {
    const Q = QUESTIONS[i];
    s[Q.axis] += ANSWERS[j].w * (Q.yes === first[Q.axis] ? 1 : -1);
  });
  return s; // positive = E / N / F
}
function leaning(axis, v) {
  const [a, b] = Object.keys(AXES[axis].poles);
  const pos = { energy: "E", sense: "N", judge: "F" }[axis];
  const neg = a === pos ? b : a;
  return v >= 0 ? pos : neg;
}

function thinking() {
  render(`<div class="stack">${stage("think", "むむむ……12の答えを並べて、本棚と照らし合わせておる……")}</div>`);
  boot("think");
  setTimeout(result, reduceMotion ? 600 : 2200);
}

function result() {
  const s = axisScores();
  const key = ["energy", "sense", "judge"].map(k => leaning(k, s[k])).join(""); // e.g. "INF"
  const T = TYPES[key];
  const X = EXTRAS[key];
  const A = APPS[key];
  const [main, ...rest] = T.books;

  // For each axis, cite the answer that pushed hardest toward the winning pole.
  const clues = ["energy", "sense", "judge"].map(axis => {
    const pole = leaning(axis, s[axis]);
    let best = null;
    answers.forEach((j, i) => {
      const Q = QUESTIONS[i];
      if (Q.axis !== axis) return;
      const toward = ANSWERS[j].w * (Q.yes === pole ? 1 : -1);
      if (!best || toward > best.toward) best = { Q, j, toward };
    });
    const max = 8; // 4 questions × weight 2
    const pos = { energy: "E", sense: "N", judge: "F" }[axis];
    const pct = 50 + (s[axis] / max) * 50 * (pos === Object.keys(AXES[axis].poles)[0] ? -1 : 1);
    return { axis, pole, best, pct };
  });

  render(`
    <div class="stack">
      ${stage("happy", `わかったぞ！ 君は「${T.name}」じゃ！ そんな君への一冊は……これじゃ！`, true)}

      <article class="panel book hero-book" style="${cvar(key)}; padding:0">
        <div class="spine" aria-hidden="true">${esc(main.title)}</div>
        <div class="book-body">
          <div class="label">ベタ丸の本命</div>
          <h3>${esc(main.title)}</h3>
          <div class="author">${esc(main.author)}</div>
          ${main.tag ? `<span class="tag">${esc(main.tag)}</span>` : ""}
          <p class="why">${esc(main.why)}</p>
          <a href="https://www.google.com/search?q=${encodeURIComponent(main.title + " " + main.author + " 漫画")}" target="_blank" rel="noopener">作品を検索する →</a>
        </div>
      </article>

      <section class="panel stack type-card" style="${cvar(key)}">
        <div class="kicker">君の読者タイプ</div>
        <h1 class="typename">${T.name}</h1>
        <p class="catch">${T.catch}</p>
        <p class="lede">${T.desc}</p>
      </section>

      <section class="panel stack">
        <h2>ベタ丸の推理メモ</h2>
        <div class="deduce">
          ${clues.map(c => {
            const [a, b] = Object.keys(AXES[c.axis].poles);
            return `
            <div class="clue" style="${cvar(key)}">
              <div class="label">${AXES[c.axis].label}</div>
              <p class="clue-q">「${esc(c.best.Q.q)}」に <b>${ANSWERS[c.best.j].label}</b> と答えたな。</p>
              <div class="meter">
                <span class="${c.pole === a ? "win" : ""}">${AXES[c.axis].poles[a]}</span>
                <div class="meter-track"><div class="meter-dot" style="left:50%" data-left="${Math.max(4, Math.min(96, c.pct))}"></div></div>
                <span class="${c.pole === b ? "win" : ""}">${AXES[c.axis].poles[b]}</span>
              </div>
              <p class="clue-why">${esc(c.best.Q.yes === c.pole ? c.best.Q.why : c.best.Q.whyNo)}つまり君は「${AXES[c.axis].poles[c.pole]}」寄りじゃ。</p>
            </div>`;
          }).join("")}
        </div>
      </section>

      <section class="panel stack">
        <h2>本命のあとに読むなら</h2>
        <div class="more">
          ${rest.map(b => `
            <article class="book" style="${cvar(key)}">
              <div class="spine" aria-hidden="true">${esc(b.title)}</div>
              <div class="book-body">
                <h3>${esc(b.title)}</h3>
                <div class="author">${esc(b.author)}</div>
                ${b.tag ? `<span class="tag">${esc(b.tag)}</span>` : ""}
                <p class="why">${esc(b.why)}</p>
                <a href="https://www.google.com/search?q=${encodeURIComponent(b.title + " " + b.author + " 漫画")}" target="_blank" rel="noopener">作品を検索する →</a>
              </div>
            </article>`).join("")}
        </div>
      </section>

      <section class="panel stack">
        <h2>アプリで今すぐ読める連載中の一作</h2>
        <article class="book" style="${cvar(key)}">
          <div class="spine" aria-hidden="true">${esc(A.app)}</div>
          <div class="book-body">
            <span class="app-tag">${esc(A.app)}で連載中</span>
            <h3>${esc(A.title)}</h3>
            <div class="author">${esc(A.author)}</div>
            ${A.tag ? `<span class="tag">${esc(A.tag)}</span>` : ""}
            <p class="why">${esc(A.why)}</p>
            <a href="https://www.google.com/search?q=${encodeURIComponent(A.title + " " + A.app)}" target="_blank" rel="noopener">${esc(A.app)}で探す →</a>
          </div>
        </article>
      </section>

      <section class="panel stack">
        <h2>漫画以外なら、これもどうじゃ</h2>
        <div class="more">
          ${[["小説", X.novel], ["映画", X.movie]].map(([kind, w]) => `
            <article class="book" style="${cvar(key)}">
              <div class="spine" aria-hidden="true">${kind}</div>
              <div class="book-body">
                <span class="tag">${kind}</span>
                <h3>${esc(w.title)}</h3>
                <div class="author">${esc(w.by)}</div>
                <p class="why">${esc(w.why)}</p>
                <a href="https://www.google.com/search?q=${encodeURIComponent(w.title + " " + w.by.split("・")[0] + " " + kind)}" target="_blank" rel="noopener">作品を検索する →</a>
              </div>
            </article>`).join("")}
        </div>
      </section>

      <div class="row">
        <button class="btn" id="again" type="button">もう一度診断する</button>
        <button class="btn ghost" id="copy" type="button">結果をコピー</button>
        <span class="copied" id="copied" role="status"></span>
      </div>
    </div>`);
  boot("happy");

  requestAnimationFrame(() => requestAnimationFrame(() =>
    app.querySelectorAll(".meter-dot").forEach(el => el.style.left = el.dataset.left + "%")));

  document.getElementById("again").onclick = intro;
  document.getElementById("copy").onclick = () => {
    const text = `マンガ性格診断の結果：「${T.name}」\n${T.catch}\nベタ丸の本命：『${main.title}』（${main.author}）\n次に読むなら：${rest.map(b => "『" + b.title + "』").join(" ")}\nアプリで連載中：『${A.title}』（${A.app}）\n小説：『${X.novel.title}』（${X.novel.by}）\n映画：『${X.movie.title}』（${X.movie.by}）`;
    const msg = document.getElementById("copied");
    navigator.clipboard.writeText(text)
      .then(() => { msg.textContent = "コピーしました"; })
      .catch(() => { msg.textContent = text; });
  };
}

intro();
</script>
</body>
</html>
