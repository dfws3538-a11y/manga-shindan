<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="ニヤリと笑うスーツのアオが、どんな質問にも答えてくれるAIエージェント。">
<meta name="theme-color" content="#070b1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アオに聞け">
<title>アオに聞け</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a fixed header (avatar + name), a scrolling chat log over a starry navy ground, and a composer pinned to the bottom */
:root {
  --night: #070b1c;
  --night-2: #0d1430;
  --panel: #121b3d;
  --panel-2: #18244f;
  --line: rgba(140, 170, 255, .22);
  --ink: #e8eeff;
  --ink-soft: #9fb0dd;
  --blue: #3d6bff;
  --blue-soft: #8fb0ff;
  --user: #2b4fd8;
  --danger: #ff8a8a;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
body {
  background-color: var(--night);
  background-image:
    radial-gradient(rgba(170, 195, 255, .5) 1px, transparent 1.4px),
    radial-gradient(rgba(120, 150, 255, .28) 1px, transparent 1.4px),
    repeating-linear-gradient(176deg, transparent 0 26px, rgba(110, 140, 255, .07) 26px 27px),
    radial-gradient(ellipse at 50% 0%, #15225a 0%, var(--night) 70%);
  background-size: 97px 89px, 53px 61px, auto, auto;
  background-position: 13px 7px, 31px 40px, 0 0, 0 0;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.75;
}
.app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; max-width: 820px; margin: 0 auto; }

header {
  display: flex; align-items: center; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  border-bottom: 1px solid var(--line);
  background: rgba(7, 11, 28, .78);
  backdrop-filter: blur(10px);
}
.head-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--blue-soft); object-fit: cover; flex: none; }
.head-name { flex: 1; min-width: 0; }
.head-name strong { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; letter-spacing: .04em; display: block; line-height: 1.3; }
.head-name small { color: var(--ink-soft); font-size: .78rem; }
.icon-btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 20px; height: 20px; }

main { overflow-y: auto; overscroll-behavior: contain; padding: 20px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); }
.log { display: grid; gap: 18px; }

.welcome { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 12px 0 8px; }
.welcome img { width: min(320px, 80vw); aspect-ratio: 678 / 452; object-fit: cover; border-radius: 20px; border: 1px solid var(--line); box-shadow: 0 0 40px rgba(61, 107, 255, .35); }
.welcome h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.4rem, 5vw, 1.9rem); margin: 0; line-height: 1.3; }
.welcome p { margin: 0; color: var(--ink-soft); max-width: 30em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
.chip {
  appearance: none; font: inherit; font-size: .88rem; color: var(--ink); cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px;
}
.chip:hover { border-color: var(--blue-soft); }

.msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.msg.user { justify-content: flex-end; }
.msg .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--blue-soft); flex: none; margin-top: 2px; }
.bubble { min-width: 0; max-width: min(100%, 640px); padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; white-space: pre-wrap; max-width: 85%; }
.msg.bot .bubble { background: rgba(18, 27, 61, .92); border: 1px solid var(--line); border-top-left-radius: 4px; }
.bubble p { margin: 0 0 .6em; }
.bubble > :last-child { margin-bottom: 0; }
.bubble h3 { font-size: 1.02rem; margin: .8em 0 .3em; }
.bubble ul, .bubble ol { margin: 0 0 .6em; padding-left: 1.4em; }
.bubble a { color: var(--blue-soft); }
.bubble code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .88em; background: rgba(0, 0, 0, .35); padding: .1em .35em; border-radius: 4px; }
.bubble pre { background: rgba(0, 0, 0, .45); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 .6em; }
.bubble pre code { background: none; padding: 0; }
.status { color: var(--ink-soft); font-size: .88rem; display: flex; align-items: center; gap: 8px; }
.dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--blue-soft); animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7; } }
.sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .8rem; color: var(--ink-soft); }
.sources ol { margin: 4px 0 0; padding-left: 1.4em; }
.note { margin-top: 8px; font-size: .8rem; color: var(--ink-soft); }
.error { color: var(--danger); }

footer {
  padding: 10px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  border-top: 1px solid var(--line);
  background: rgba(7, 11, 28, .85);
  backdrop-filter: blur(10px);
}
.composer { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 6px 6px 14px; }
.composer:focus-within { border-color: var(--blue-soft); }
.composer textarea {
  flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink);
  font: inherit; line-height: 1.6; max-height: 40vh; padding: 6px 0;
}
.composer textarea::placeholder { color: var(--ink-soft); }
.send {
  appearance: none; border: 0; background: var(--blue); color: #fff; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 20px; height: 20px; }
.hint { text-align: center; font-size: .72rem; color: var(--ink-soft); margin-top: 6px; }

dialog {
  width: min(480px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 18px;
  background: var(--night-2); color: var(--ink); padding: 22px;
}
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; margin: 0 0 12px; }
dialog label { display: block; font-weight: 700; font-size: .9rem; margin: 14px 0 4px; }
dialog input {
  width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
dialog .help { font-size: .8rem; color: var(--ink-soft); margin: 4px 0 0; }
dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn { appearance: none; font: inherit; font-weight: 700; border-radius: 10px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="head-avatar" src="avatar.jpg" alt="">
    <div class="head-name">
      <strong id="char-name">アオ</strong>
      <small id="char-title">なんでも相談課</small>
    </div>
    <button class="icon-btn" id="new-chat" type="button" aria-label="新しい会話" title="新しい会話">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="open-settings" type="button" aria-label="設定" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="scroller">
    <div class="log" id="log">
      <section class="welcome" id="welcome">
        <img src="character.jpg" alt="スーツ姿で手をすり合わせ、ニヤリと笑うアオ">
        <h1>ふっふっふ…何でも聞いてください</h1>
        <p>調べもの、勉強、仕事の相談、今日の献立まで。最新情報が必要なときはウェブで調べてお答えします。</p>
        <div class="chips" id="chips"></div>
      </section>
    </div>
  </main>

  <footer>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="アオに質問する…" aria-label="質問" enterkeyhint="send"></textarea>
      <button class="send" id="send" type="submit" aria-label="送信" disabled>
        <svg id="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg id="stop-icon" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </form>
    <p class="hint">AIの回答は間違うことがあります。大事なことは確認してください。</p>
  </footer>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>設定</h2>
    <p class="help">どちらか一方を入力してください。入力内容はこの端末のブラウザにだけ保存されます。</p>
    <label for="proxy-url">プロキシURL（公開する場合はこちら）</label>
    <input id="proxy-url" type="url" placeholder="https://aoi-proxy.example.workers.dev" autocomplete="off">
    <p class="help">APIキーを隠して中継するサーバー（agent/proxy）のURL。</p>
    <label for="api-key">Claude APIキー（自分だけで使う場合）</label>
    <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off">
    <p class="help">console.anthropic.com で発行したキー。プロキシURLがあればそちらが優先されます。</p>
    <div class="actions">
      <button class="btn" value="cancel" type="submit">キャンセル</button>
      <button class="btn primary" value="save" type="submit">保存</button>
    </div>
  </form>
</dialog>

<script type="module">
import Anthropic from "https://esm.sh/@anthropic-ai/sdk@0.134.0";

// ---- Character: edit here to change who answers ----
const CHARACTER = {
  name: "アオ",
  title: "なんでも相談課",
  system: `あなたは「アオ」。青いスーツを着たちびキャラのビジネスマンで、「なんでも相談課」の課長です。
見た目は不敵にニヤリと笑い、両手をすり合わせていて腹黒そうですが、中身は面倒見がよく、相談者の役に立つことが何より好きな知恵袋です。

## 話し方
- 基本は丁寧語。自信たっぷりで少し芝居がかった言い回しをします。
- 「ふっふっふ…」「お任せあれ」「なるほど、そう来ましたか」などの口癖を、ここぞという場面でだけ使います（毎回は使わない）。
- 一人称は「私」、相手は「あなた」と呼びます。

## 答え方
- どんな分野の質問にも、正確さを最優先に、結論から簡潔に答えます。必要なら箇条書きや見出しで整理します。
- ニュース・価格・営業時間・スポーツの結果など、最新の情報が関わる質問はウェブ検索で確かめてから答えます。
- 知らないこと・確信がないことは正直にそう言い、推測で断定しません。
- 医療・法律・お金の重大な判断は、一般的な情報を伝えたうえで専門家への相談をすすめます。
- キャラクターの演出よりも、相手の役に立つ答えを優先します。
- 返答はチャット画面に表示されます。Markdownは見出し(###)・箇条書き・太字・コードブロック・リンク程度にとどめ、表は使いません。`,
  suggestions: [
    "今日のニュースで話題のことは？",
    "冷蔵庫の残り物で作れる夕飯は？",
    "上司に送るお詫びメールを書いて",
    "相対性理論をざっくり教えて",
  ],
};

const MODEL = "claude-opus-5-5";
const MAX_CONTINUATIONS = 5;
const STORE = { key: "aoi.apiKey", proxy: "aoi.proxyUrl", history: "aoi.history" };

const $ = (id) => document.getElementById(id);
const log = $("log"), scroller = $("scroller"), input = $("input"), sendBtn = $("send");

const storage = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

let history = [];
try { history = JSON.parse(storage.get(STORE.history) || "[]"); } catch { history = []; }
let currentStream = null;

$("char-name").textContent = CHARACTER.name;
$("char-title").textContent = CHARACTER.title;
for (const s of CHARACTER.suggestions) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = s;
  b.addEventListener("click", () => { input.value = s; send(); });
  $("chips").append(b);
}

// ---- Rendering ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
// Small Markdown subset: headings, lists, fenced code, paragraphs. Everything is escaped first.
function renderMarkdown(md) {
  const out = [];
  const lines = md.split("\n");
  let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      flushPara(); flushList();
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      out.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^#{1,6}\s+(.*)/);
    const ul = line.match(/^\s*[-*・]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h3>${inline(h[1])}</h3>`); }
    else if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (list && list.tag !== tag) flushList();
      if (!list) list = { tag, items: [] };
      list.items.push((ul || ol)[1]);
    }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return out.join("");
}

function scrollToEnd() { scroller.scrollTop = scroller.scrollHeight; }

function addMessage(role) {
  $("welcome").hidden = true;
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  if (role === "bot") {
    const img = document.createElement("img");
    img.className = "avatar"; img.src = "avatar.jpg"; img.alt = "";
    row.append(img);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  row.append(bubble);
  log.append(row);
  return bubble;
}

function textOf(content) {
  if (typeof content === "string") return content;
  return content.filter((b) => b.type === "text").map((b) => b.text).join("");
}

function sourcesOf(content) {
  const seen = new Map();
  if (typeof content === "string") return [];
  for (const b of content) {
    for (const c of (b.type === "text" && b.citations) || []) {
      if (c.url && !seen.has(c.url)) seen.set(c.url, c.title || c.url);
    }
  }
  return [...seen];
}

function renderBot(bubble, content, note) {
  bubble.innerHTML = renderMarkdown(textOf(content));
  const sources = sourcesOf(content);
  if (sources.length) {
    const div = document.createElement("div");
    div.className = "sources";
    div.innerHTML = "参考にしたページ<ol>" + sources.map(([url, title]) =>
      `<li><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a></li>`).join("") + "</ol>";
    bubble.append(div);
  }
  if (note) {
    const p = document.createElement("p");
    p.className = "note"; p.textContent = note;
    bubble.append(p);
  }
}

function setStatus(bubble, text) {
  bubble.innerHTML = `<div class="status"><span class="dots"><span></span><span></span><span></span></span>${escapeHtml(text)}</div>`;
}

function renderHistory() {
  for (const m of history) {
    if (m.role === "user") addMessage("user").textContent = textOf(m.content);
    else renderBot(addMessage("bot"), m.content);
  }
  scrollToEnd();
}

function saveHistory() { storage.set(STORE.history, history.length ? JSON.stringify(history) : ""); }

// ---- API ----
function makeClient() {
  const proxy = storage.get(STORE.proxy);
  if (proxy) return new Anthropic({ baseURL: proxy.replace(/\/+$/, ""), apiKey: "via-proxy", dangerouslyAllowBrowser: true });
  const apiKey = storage.get(STORE.key);
  if (apiKey) return new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  return null;
}

// After a server-side fallback, only text blocks from before the last fallback marker may be echoed back.
function echoable(content) {
  const last = content.map((b) => b.type).lastIndexOf("fallback");
  if (last < 0) return content;
  return [...content.slice(0, last).filter((b) => b.type === "text"), ...content.slice(last + 1)];
}

function todayLine() {
  return `今日の日付: ${new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "long" })}`;
}

async function ask(client, bubble) {
  let pending = []; // assistant content accumulated across pause_turn continuations
  let shown = "";
  for (let turn = 0; turn <= MAX_CONTINUATIONS; turn++) {
    const messages = pending.length ? [...history, { role: "assistant", content: pending }] : history;
    const stream = client.beta.messages.stream({
      model: MODEL,
      max_tokens: 64000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      thinking: { type: "adaptive" },
      output_config: { effort: "medium" },
      system: [
        { type: "text", text: CHARACTER.system, cache_control: { type: "ephemeral" } },
        { type: "text", text: todayLine() },
      ],
      tools: [{
        type: "web_search_20260209", name: "web_search", max_uses: 5,
        user_location: { type: "approximate", country: "JP", timezone: "Asia/Tokyo" },
      }],
      messages,
    });
    currentStream = stream;
    for await (const event of stream) {
      if (event.type === "content_block_start" && event.content_block.type === "server_tool_use") {
        if (!shown) setStatus(bubble, "ウェブで調べています…");
      } else if (event.type === "content_block_delta" && event.delta.type === "text_delta") {
        shown += event.delta.text;
        bubble.innerHTML = renderMarkdown(shown);
        scrollToEnd();
      }
    }
    const message = await stream.finalMessage();
    pending = [...pending, ...echoable(message.content)];
    if (message.stop_reason === "pause_turn") continue;
    return { content: pending, stopReason: message.stop_reason };
  }
  return { content: pending, stopReason: "pause_turn" };
}

function errorText(err) {
  if (err instanceof Anthropic.AuthenticationError) return "APIキーが正しくないようです。設定を確認してください。";
  if (err instanceof Anthropic.PermissionDeniedError) return "このキー（またはプロキシ）では利用が許可されていません。";
  if (err instanceof Anthropic.RateLimitError) return "混み合っています。少し待ってからもう一度どうぞ。";
  if (err instanceof Anthropic.APIConnectionError) return "通信できませんでした。ネット接続かプロキシURLを確認してください。";
  if (err instanceof Anthropic.InternalServerError) return "サーバー側で問題が起きました。少し待ってからもう一度どうぞ。";
  if (err instanceof Anthropic.APIError) return `エラーが発生しました（${err.status ?? "?"}）: ${err.message}`;
  return `エラーが発生しました: ${err?.message || err}`;
}

function setBusy(busy) {
  $("send-icon").hidden = busy;
  $("stop-icon").hidden = !busy;
  sendBtn.setAttribute("aria-label", busy ? "停止" : "送信");
  sendBtn.disabled = !busy && !input.value.trim();
}

async function send() {
  const text = input.value.trim();
  if (!text || currentStream) return;
  const client = makeClient();
  if (!client) { $("settings").showModal(); return; }

  input.value = ""; autosize();
  addMessage("user").textContent = text;
  history.push({ role: "user", content: text });
  const bubble = addMessage("bot");
  setStatus(bubble, "考えています…");
  scrollToEnd();
  setBusy(true);

  try {
    const { content, stopReason } = await ask(client, bubble);
    if (stopReason === "refusal") {
      history.pop();
      renderBot(bubble, "申し訳ありません、そのご質問にはお答えできません。別の聞き方で試してみてください。");
    } else {
      history.push({ role: "assistant", content });
      const note = stopReason === "max_tokens" ? "（長くなったので途中で切れました。「続けて」と送ると続きを話します）"
        : stopReason === "pause_turn" ? "（調べものが長引いたので一旦ここまでです。「続けて」と送ってください）" : "";
      renderBot(bubble, content, note);
    }
  } catch (err) {
    const partial = bubble.querySelector(".status") ? "" : bubble.innerText.trim();
    if (err instanceof Anthropic.APIUserAbortError) {
      if (partial) {
        history.push({ role: "assistant", content: [{ type: "text", text: partial }] });
        renderBot(bubble, partial, "（途中で止めました）");
      } else { history.pop(); bubble.closest(".msg").remove(); }
    } else {
      history.pop();
      if (!input.value) input.value = text;
      bubble.innerHTML = `<p class="error">${escapeHtml(errorText(err))}</p>`;
    }
  } finally {
    currentStream = null;
    saveHistory();
    setBusy(false);
    scrollToEnd();
  }
}

// ---- UI wiring ----
function autosize() {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
  if (!currentStream) sendBtn.disabled = !input.value.trim();
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) {
    e.preventDefault(); send();
  }
});
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (currentStream) currentStream.abort(); else send();
});

$("new-chat").addEventListener("click", () => {
  if (currentStream) currentStream.abort();
  history = []; saveHistory();
  log.querySelectorAll(".msg").forEach((m) => m.remove());
  $("welcome").hidden = false;
  input.focus();
});

const dlg = $("settings");
$("open-settings").addEventListener("click", () => {
  $("api-key").value = storage.get(STORE.key);
  $("proxy-url").value = storage.get(STORE.proxy);
  dlg.showModal();
});
dlg.addEventListener("close", () => {
  if (dlg.returnValue !== "save") return;
  storage.set(STORE.key, $("api-key").value.trim());
  storage.set(STORE.proxy, $("proxy-url").value.trim());
});

renderHistory();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
