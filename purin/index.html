<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プリンめぐり地図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 左に日本地図、右に「さがす／スタンプ帳」パネル。上部に育つプリンの花。スマホでは縦積み */
:root{
  --bg:#fff6d6;        /* カスタード */
  --panel:#fffdf3;
  --ink:#3b2412;       /* 焦がしカラメル */
  --muted:#7a5f45;
  --line:#ecd9a6;
  --sea:#fbeebc;
  --land:#ffd765;
  --land-edge:#c98a2c;
  --custard:#ffe08a;
  --caramel:#8a4a17;
  --cherry:#d4243f;
  --hanko:#c8102e;
  --leaf:#4f9a45;
  --chip:#fff0bf;
  --on-accent:#ffffff;
  --shadow:0 2px 0 rgba(59,36,18,.18);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#21160d;--panel:#2b1d12;--ink:#fbe9c2;--muted:#c7aa84;--line:#4a3420;
  --sea:#1a120a;--land:#6b4a1c;--land-edge:#c98a2c;--custard:#f3cf6a;--caramel:#f0a54a;--cherry:#ff5a70;--hanko:#ff4d63;--leaf:#7cc46f;--chip:#3a2817;
  --shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#21160d;--panel:#2b1d12;--ink:#fbe9c2;--muted:#c7aa84;--line:#4a3420;
  --sea:#1a120a;--land:#6b4a1c;--land-edge:#c98a2c;--custard:#f3cf6a;--caramel:#f0a54a;--cherry:#ff5a70;--hanko:#ff4d63;--leaf:#7cc46f;--chip:#3a2817;
  --shadow:0 2px 0 rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;
  display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}

/* ---- ヘッダーと花 ---- */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;width:100%;max-width:1320px;margin:0 auto}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.6vw,40px);line-height:1.1;margin:0;letter-spacing:.02em}
h1 small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin-bottom:4px}
.bloom{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:4px 18px 4px 6px;box-shadow:3px 3px 0 var(--ink)}
.bloom svg{width:54px;height:58px;flex:none}
.bloom .big{font-family:var(--f-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.bloom .lbl{font-size:12px;color:var(--muted)}
.bloom .stats{display:flex;gap:16px;align-items:baseline}
.bloom .next{font-size:12.5px;font-weight:700}
.dots{display:flex;gap:4px;margin-top:3px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--muted)}
.dots i.on{background:var(--hanko);border:1.5px solid var(--hanko)}

.hdr-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pairbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);max-width:260px}
.pairbtn #pairTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pairbtn .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.pairbtn.on .dot{background:var(--leaf);border-color:var(--leaf)}
.pairbtn.wait .dot{background:var(--custard);border-color:var(--caramel)}
.code{font-family:var(--f-display);font-size:32px;letter-spacing:.14em;text-align:center;background:var(--bg);border:2px dashed var(--caramel);border-radius:14px;padding:10px 8px;margin:6px 0 10px;user-select:all;font-variant-numeric:tabular-nums}
.pairsec{border-top:2px dashed var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px}
.pairsec h3{margin:0;font-size:15px}
.pairsec p,.pairnote{margin:0;font-size:13px;color:var(--muted)}
.codein{font-family:var(--f-display);font-size:22px;letter-spacing:.12em;text-transform:uppercase;text-align:center;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;width:100%}
.err{color:var(--hanko);font-weight:700;font-size:13px;margin:0}
.members{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.members li{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:13px}
.members img{width:24px;height:24px;border-radius:50%}
.check{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px!important;font-weight:500!important}
.whoate{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--hanko);font-weight:700}
.stampbtn.partner{border:2.5px solid color-mix(in srgb,var(--hanko) 45%,transparent);color:var(--hanko);background:color-mix(in srgb,var(--hanko) 6%,transparent)}
/* ---- 本体 ---- */
.app{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;width:100%;max-width:1320px;margin:0 auto;flex:1;min-height:560px}
@media (max-width:860px){.app{grid-template-columns:1fr;flex:none}.mapwrap{height:54vh;min-height:360px}.side{height:auto;max-height:none}.list{max-height:none;overflow:visible}}

.mapwrap{position:relative;background:var(--sea);border:2px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
#map.placing{cursor:crosshair}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.pin{cursor:pointer}
.pin .cup{fill:var(--custard);stroke:#3b2412;stroke-width:1.6}
.pin .top{fill:#8a4a17;stroke:#3b2412;stroke-width:1.6}
.pin .cherry{fill:var(--cherry);stroke:#3b2412;stroke-width:1.2}
.pin .badge{display:none}
.pin.eaten .badge{display:inline}
.pin .badge circle{fill:var(--hanko);stroke:#fff;stroke-width:1.6}
.pin .badge path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pin.mine .cup{fill:#ffc2cc}
.pin.dim{opacity:.15;pointer-events:none}
.pin .halo{fill:transparent}
.pin.active .halo{fill:var(--cherry);opacity:.28}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);font-size:20px;font-weight:700;box-shadow:var(--shadow)}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.placing-bar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--cherry);color:var(--on-accent);font-weight:700;padding:6px 14px;border-radius:999px;font-size:13px;white-space:nowrap}

/* ---- 詳細カード ---- */
.card{position:absolute;left:10px;top:10px;width:min(330px,calc(100% - 68px));background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.card .txt{min-width:0}
.card h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 2px;line-height:1.25;padding-right:20px}
.card .shop{font-weight:700;margin:0;line-height:1.35}
.card .where{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.card .note{grid-column:1/-1;margin:6px 0 4px;font-size:14px}
.card .row{grid-column:1/-1}
.card .close{position:absolute;right:6px;top:4px;border:0;background:none;font-size:22px;color:var(--muted);line-height:1;padding:4px 6px}
.card .stampcol{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.primary{background:var(--cherry);color:var(--on-accent)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.linkish{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px}
.linkish.armed{color:var(--hanko);font-weight:700}

/* ---- スタンプ（はんこ） ---- */
.stampbtn{width:58px;height:58px;border-radius:50%;border:2.5px dashed var(--muted);background:transparent;color:var(--muted);font-weight:700;font-size:12px;line-height:1.15;display:grid;place-items:center;flex:none;padding:0;transition:transform .12s}
.stampbtn:hover{border-color:var(--hanko);color:var(--hanko);transform:rotate(-6deg)}
.stampbtn.done{border:3px double var(--hanko);color:var(--hanko);background:color-mix(in srgb,var(--hanko) 8%,transparent);transform:rotate(-10deg);font-family:var(--f-display);font-weight:400;font-size:20px}
.stampbtn.done small{display:block;font-family:var(--f-body);font-weight:700;font-size:9.5px;letter-spacing:0}
.stampbtn.big{width:72px;height:72px;font-size:13px}
.stampbtn.big.done{font-size:24px}
.stampdate{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .stampbtn.just{animation:stampIn .38s cubic-bezier(.2,1.6,.4,1)}
  @keyframes stampIn{0%{transform:scale(1.9) rotate(-28deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-10deg)}}
  .pin{transition:opacity .2s}
}

/* ---- サイドパネル ---- */
.side{background:var(--panel);border:2px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--ink)}
.tabs button{border:0;background:var(--chip);padding:11px 8px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button + button{border-left:2px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.tabs .count{font-family:var(--f-display);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{padding:12px 14px 8px;border-bottom:2px dashed var(--line);display:grid;gap:8px}
.search{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.result{font-size:12px;color:var(--muted);margin:0}
.list{list-style:none;margin:0;padding:4px 6px;overflow:auto;flex:1;min-height:0}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 8px 9px 12px;border-radius:12px;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.list li.active{background:var(--chip)}
.list .info{min-width:0;border:0;background:none;text-align:left;padding:0;display:block;width:100%}
.list .nm{font-weight:700;line-height:1.3}
.list .sub{font-size:12.5px;color:var(--muted);line-height:1.4}
.infowrap{min-width:0;display:grid;gap:3px;justify-items:start}
.detlink{font-size:12px;font-weight:700;color:var(--caramel);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:1px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detlink span{font-weight:500;color:var(--muted);margin-left:6px}
.detlink.search{color:var(--muted);border-style:dashed}
.detlink:hover,.detail:hover{border-color:var(--caramel)}
.card .detail{grid-column:1/-1;display:grid;gap:0;text-decoration:none;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:8px;min-width:0}
.card .detail b{font-size:12px;color:var(--muted)}
.card .detail span{font-weight:700;color:var(--caramel);overflow-wrap:anywhere}
.card .detail.search span{color:var(--muted)}
.list .acts{display:flex;align-items:center;gap:8px}
.heart{border:0;background:none;font-size:20px;color:var(--line);padding:4px;line-height:1}
.heart.on{color:var(--cherry)}
.empty{padding:24px;text-align:center;color:var(--muted);display:block!important}
.foot{padding:10px 14px;border-top:2px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.fine{font-size:11.5px;color:var(--muted);margin:0;line-height:1.5}

/* ---- スタンプ帳 ---- */
.book{overflow:auto;flex:1;min-height:0;padding:14px}
.garden{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;margin-bottom:16px}
.garden h2,.book h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0}
.flowers{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.flowers figure{margin:0;display:grid;justify-items:center;flex:none;width:66px}
.flowers svg{width:62px;height:66px}
.flowers figcaption{font-size:11px;color:var(--muted);text-align:center;line-height:1.3;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px 8px;margin:10px 0 18px}
.slot{border:0;background:none;padding:0;display:grid;justify-items:center;gap:4px;text-align:center;font-size:11px;line-height:1.3;color:var(--muted)}
.slot .stampbtn{pointer-events:none;width:54px;height:54px}
.slot b{color:var(--ink);font-weight:700;display:block}

/* ---- 満開のお祝い ---- */
.celebrate{position:fixed;inset:0;background:rgba(40,24,10,.5);display:grid;place-items:center;z-index:50;padding:16px}
.celebrate .box{background:var(--panel);border:2px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:22px 24px;text-align:center;width:min(360px,100%)}
.celebrate svg{width:170px;height:180px}
.celebrate h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:4px 0}
.celebrate p{margin:0 0 14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .celebrate svg .petal{transform-box:fill-box;transform-origin:center;animation:open .7s cubic-bezier(.2,1.4,.4,1) backwards}
  @keyframes open{from{transform:scale(0)}}
  .celebrate .spark{animation:twinkle 1.2s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.2}to{opacity:1}}
}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

dialog{border:2px solid var(--ink);border-radius:18px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,calc(100vw - 32px));box-shadow:6px 6px 0 var(--ink)}
dialog::backdrop{background:rgba(40,24,10,.45)}
dialog h2{font-family:var(--f-display);font-weight:400;margin:0 0 12px;font-size:22px}
dialog label{display:grid;gap:4px;font-size:13px;font-weight:700;margin-bottom:10px}
dialog input,dialog textarea{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:500}
.picked{font-size:13px;color:var(--muted);margin:0 0 12px}
</style>

</head>
<body>
<header>
  <h1><small>全国の絶品プリンだけを集めた</small>プリンめぐり地図</h1>
  <div class="hdr-right">
  <button type="button" class="pairbtn" id="pairBtn"><span class="dot" aria-hidden="true"></span><span id="pairTxt">ふたりで共有</span></button>
  <button type="button" class="bloom" id="bloomBadge" aria-label="スタンプ帳を開く">
    <span id="bloomFlower"></span>
    <span>
      <span class="stats">
        <span><span class="big" id="cntAte">0</span><span class="lbl">/<span id="cntAll">0</span>店</span></span>
        <span><span class="big" id="cntFlower">0</span><span class="lbl">輪満開</span></span>
      </span>
      <span class="dots" id="dots" aria-hidden="true"></span>
      <span class="next" id="nextTxt"></span>
    </span>
  </button>
  </div>
</header>

<main class="app">
  <section class="mapwrap" aria-label="日本地図">
    <svg id="map" role="img" aria-label="プリンの名店をピンで示した日本地図"></svg>
    <div class="zoom">
      <button type="button" id="zin" aria-label="拡大">＋</button>
      <button type="button" id="zout" aria-label="縮小">－</button>
      <button type="button" id="zreset" aria-label="全国を表示" style="font-size:13px">全</button>
    </div>
    <div class="hint">ピンをタップ／ドラッグで移動・ピンチで拡大</div>
    <div class="placing-bar" id="placingBar" hidden>地図をタップして場所を決めてください</div>
    <article class="card" id="card" hidden></article>
  </section>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabFind" aria-selected="true">さがす</button>
      <button type="button" role="tab" id="tabBook" aria-selected="false">スタンプ帳<span class="count" id="tabCount">0</span></button>
    </div>
    <div id="paneFind" style="display:contents">
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="お店・プリン名・地名でさがす（例：温泉）" aria-label="検索">
        <div class="chips" id="regionChips" aria-label="地方"></div>
        <div class="chips" id="tagChips" aria-label="しぼりこみ"></div>
        <p class="result" id="result"></p>
      </div>
      <ul class="list" id="list"></ul>
      <div class="foot">
        <p class="fine">食べたら右の丸をタップしてスタンプ。各店の詳細ページは公式サイトまたは紹介記事です。<br>ピンはおおよその位置です。営業情報は来店前にご確認を。</p>
        <button type="button" class="btn primary" id="addBtn">＋ 推しプリンを登録</button>
      </div>
    </div>
    <div id="paneBook" class="book" hidden></div>
  </aside>
</main>

<div class="celebrate" id="celebrate" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<dialog id="pairDlg" aria-labelledby="pairH">
  <div id="pairBody"></div>
</dialog>

<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h2>推しプリンを登録</h2>
    <label>プリンの名前<input id="fPudding" required maxlength="40" placeholder="例：昔ながらのかためプリン"></label>
    <label>お店の名前<input id="fShop" required maxlength="40" placeholder="例：喫茶〇〇"></label>
    <label>都道府県・市区町村<input id="fCity" maxlength="40" placeholder="例：長野県松本市"></label>
    <label>ひとことメモ<textarea id="fNote" rows="2" maxlength="120" placeholder="カラメルがほろ苦くて最高"></textarea></label>
    <p class="picked" id="picked">場所：未指定</p>
    <div class="row">

// ---- 記録（ひとり：このブラウザに保存／ふたり：招待コードの共有データに保存） ----
// S.ate: id -> {記録した人: ミリ秒|null}　S.want: id -> true|null　S.mine: id -> 推しプリン|null
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const SOLO = "me";
let uid = null, pair = null, db = null, user = null, canWrite = null, names = {};
const meKey = () => pair ? uid : SOLO;
function loadSolo(){
  let v = store.get("purin.v2", null);
  if (v) return v;
  v = {ate:{}, want:{}, mine:{}};               // 旧バージョンの記録を引き継ぐ
  for (const [id, m] of Object.entries(store.get("purin.marks", {}))) { if (m === "ate") v.ate[id] = {[SOLO]: Date.now()}; if (m === "want") v.want[id] = true; }
  for (const [id, d] of Object.entries(store.get("purin.ate", {}))) v.ate[id] = {[SOLO]: new Date(d + "T12:00:00").getTime() || Date.now()};
  for (const id of Object.keys(store.get("purin.want", {}))) v.want[id] = true;
  for (const m of store.get("purin.mine", [])) v.mine[m.id] = m;
  store.set("purin.v2", v); return v;
}
let S = loadSolo();
function merge(t, p){ for (const k in p) { const v = p[k]; if (v && typeof v === "object" && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== "object") t[k] = {}; merge(t[k], v); } else t[k] = v; } return t; }
let writeQ = Promise.resolve();
function write(patch){
  merge(S, patch);
  if (!pair) { store.set("purin.v2", S); return; }
  const ref = pair.ref;                           // 同じ共有データへの書き込みは1つずつ順番に
  writeQ = writeQ.then(() => ref.update(patch)).catch(() => toast("共有に保存できませんでした。通信状態を確認してください"));
}
const mineList = () => Object.values(S.mine || {}).filter(Boolean);
const all = () => SHOPS.concat(mineList());
const byId = id => all().find(s => s.id === id);
const whoAte = id => Object.entries((S.ate || {})[id] || {}).filter(([, t]) => t);
const isAte = id => whoAte(id).length > 0;
const myTs = id => ((S.ate || {})[id] || {})[meKey()] || 0;
const firstTs = id => Math.min(...whoAte(id).map(x => x[1]));
const isWant = id => !!(S.want || {})[id];
const ateOrder = () => all().filter(s => isAte(s.id)).map(s => s.id).sort((a, b) => firstTs(a) - firstTs(b));
const ateCount = () => ateOrder().length;
const md = t => { if (!t) return ""; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const partnerId = () => pair && Object.keys(pair.members).find(k => pair.members[k] && k !== uid);
const partnerName = () => names[partnerId()] || "パートナー";

// ---- プリンの花（SVG） ----
function flowerSVG(petals, opts = {}){
  const P = [];
  for (let i = 0; i < 5; i++) {
    const a = -90 + i * 72, on = i < petals;
    P.push(`<g transform="rotate(${a + 90} 0 -8)"><ellipse class="petal" style="animation-delay:${i * 90}ms" cx="0" cy="-30" rx="12.5" ry="19"
      fill="${on ? "var(--custard)" : "none"}" stroke="${on ? "var(--caramel)" : "var(--muted)"}" stroke-width="${on ? 2.4 : 1.8}" ${on ? "" : 'stroke-dasharray="4 4"'}/>
      ${on ? `<path d="M-6,-40 Q0,-46 6,-40" fill="none" stroke="var(--caramel)" stroke-width="2.4" stroke-linecap="round"/>` : ""}</g>`);
  }
  const full = petals >= 5;
  const spark = opts.spark ? [[-44,-50],[44,-46],[-40,16],[42,18]].map(([x,y]) => `<path class="spark" d="M${x},${y-6}L${x+2},${y-2}L${x+6},${y}L${x+2},${y+2}L${x},${y+6}L${x-2},${y+2}L${x-6},${y}L${x-2},${y-2}Z" fill="var(--cherry)"/>`).join("") : "";
  return `<svg viewBox="-55 -62 110 118" aria-hidden="true">
    <path d="M0,10 C2,24 -2,38 0,54" stroke="var(--leaf)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0,36 C10,26 22,28 26,32 C18,40 8,40 0,36Z" fill="var(--leaf)"/>
    <path d="M0,44 C-10,34 -22,36 -26,40 C-18,48 -8,48 0,44Z" fill="var(--leaf)"/>
    ${P.join("")}
    <circle cx="0" cy="-8" r="13" fill="${full ? "#8a4a17" : "var(--line)"}" stroke="var(--caramel)" stroke-width="2"/>
    ${full ? `<circle cx="0" cy="-22" r="5" fill="var(--cherry)" stroke="#3b2412" stroke-width="1.2"/>` : ""}
    ${spark}</svg>`;
}

// ---- 投影（度 → SVG座標） ----
const K = 100, COS = Math.cos(35 * Math.PI / 180), LON0 = 122.5, LAT0 = 46;
const px = lon => (lon - LON0) * K * COS, py = lat => (LAT0 - lat) * K;
const unpx = x => x / (K * COS) + LON0, unpy = y => LAT0 - y / K;
const FULL = {x: px(122.6), y: py(45.8), w: px(146.2) - px(122.6), h: py(23.8) - py(45.8)};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const gGrid = el("g", {}, svg), gLand = el("g", {}, svg), gPins = el("g", {}, svg);
for (let lat = 25; lat <= 45; lat += 5) el("line", {class:"grid", x1:FULL.x-500, x2:FULL.x+FULL.w+500, y1:py(lat), y2:py(lat)}, gGrid);
for (let lon = 125; lon <= 145; lon += 5) el("line", {class:"grid", y1:FULL.y-500, y2:FULL.y+FULL.h+500, x1:px(lon), x2:px(lon)}, gGrid);
el("path", {class:"land", d: JAPAN.map(r => "M" + r.map(([lo, la]) => px(lo).toFixed(1) + "," + py(la).toFixed(1)).join("L") + "Z").join("")}, gLand);

// ---- ビュー（viewBox で拡大・移動） ----
let view = {...FULL};
function fitAspect(v){
  const r = svg.clientWidth / svg.clientHeight, cx = v.x + v.w/2, cy = v.y + v.h/2;
  let w = v.w, h = v.h; if (w / h < r) w = h * r; else h = w / r;
  return {x: cx - w/2, y: cy - h/2, w, h};
}
function applyView(){
  if (!svg.clientWidth || !svg.clientHeight) return;
  view = fitAspect(view);
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  const s = view.w / svg.clientWidth;
  gPins.querySelectorAll(".pin").forEach(p => p.firstChild.setAttribute("transform", `scale(${s})`));
}
function zoomAt(f, cx, cy){
  const nw = Math.min(FULL.w * 1.6, Math.max(FULL.w / 60, view.w / f)), k = nw / view.w;
  view = {x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k, w: nw, h: view.h * k};
  applyView();
}
const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); return [view.x + (cx - r.left) / r.width * view.w, view.y + (cy - r.top) / r.height * view.h]; };
function flyTo(lon, lat, w){ view = {x: px(lon) - w/2, y: py(lat) - w/2, w, h: w}; applyView(); }

svg.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = toSvg(e.clientX, e.clientY); zoomAt(Math.exp(-e.deltaY * 0.0015), x, y); }, {passive:false});
const pts = new Map(); let moved = false, pinchD = 0;
svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinchD = Math.hypot(a[0]-b[0], a[1]-b[1]); } });
svg.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    if (!moved && Math.hypot(dx, dy) < 2) return;
    moved = true; svg.classList.add("dragging");
    const s = view.w / svg.clientWidth; view.x -= dx * s; view.y -= dy * s; applyView();
  } else if (pts.size === 2) {
    moved = true; const [a, b] = [...pts.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    const [x, y] = toSvg((a[0]+b[0])/2, (a[1]+b[1])/2); if (pinchD) zoomAt(d / pinchD, x, y); pinchD = d;
  }
});
const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinchD = 0; svg.classList.remove("dragging"); };
svg.addEventListener("pointerup", e => { const wasMoved = moved; end(e); if (!wasMoved && placing) placeAt(e.clientX, e.clientY); });
svg.addEventListener("pointercancel", end);
document.getElementById("zin").onclick = () => zoomAt(1.6, view.x + view.w/2, view.y + view.h/2);
document.getElementById("zout").onclick = () => zoomAt(1/1.6, view.x + view.w/2, view.y + view.h/2);
document.getElementById("zreset").onclick = () => { view = {...FULL}; applyView(); };
new ResizeObserver(applyView).observe(svg);

function pinShape(g){

  el("path", {class:"cup", d:"M-11,-4 L-8,-20 L8,-20 L11,-4 Z"}, s);

  el("circle", {cx:10, cy:-6, r:6.5}, b); el("path", {d:"M7,-6 L9.5,-3.5 L13.5,-8.5"}, b);

let activeId = null, filters = {q:"", region:"全国", tag:"すべて"};
const matches = s => {
  const q = filters.q.trim();
  if (q && !(s.pudding + s.shop + s.pref + s.city + (s.note || "") + s.tags.join("")).includes(q)) return false;
  if (filters.region !== "全国" && regionOf(s) !== filters.region) return false;
  if (filters.tag === "まだ食べてない") return !isAte(s.id);
  if (filters.tag === "♥ 食べたい") return isWant(s.id);
  if (filters.tag === "マイプリン") return !!s.mine;
  if (filters.tag !== "すべて" && !s.tags.includes(filters.tag)) return false;
  return true;
};
function drawPins(){
  gPins.textContent = "";
  all().slice().sort((a, b) => b.lat - a.lat).forEach(s => {
    const g = el("g", {class:"pin", transform:`translate(${px(s.lon)},${py(s.lat)})`, tabindex:0, role:"button", "aria-label":`${s.shop} ${s.pudding}`}, gPins);
    g.dataset.id = s.id; pinShape(g);
    g.addEventListener("pointerdown", e => e.stopPropagation());
    g.addEventListener("click", () => select(s.id, false));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(s.id, false); } });
  });
  applyView(); refresh();
}

const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function stampHTML(id, big = false){
  const t = myTs(id), both = pair && whoAte(id).length > 1, other = whoAte(id).some(([k]) => k !== meKey());
  const cls = `stampbtn ${big ? "big" : ""}`;

  if (other) return `<button type="button" class="${cls} partner" data-stamp="${id}" aria-label="${esc(partnerName())}さんが食べたお店。自分のスタンプも押す">相手<br>済</button>`;
  return `<button type="button" class="${cls}" data-stamp="${id}" aria-label="食べた！スタンプを押す">食べた<br>！</button>`;

// ---- スタンプ ----
function stamp(id){
  if (myTs(id)) { select(id, false); return; }
  const before = Math.floor(ateCount() / PER_FLOWER);
  write({ate: {[id]: {[meKey()]: Date.now()}}, want: {[id]: null}});
  const n = ateCount(), after = Math.floor(n / PER_FLOWER);
  refresh(); if (!card.hidden && activeId === id) select(id, false);
  document.querySelectorAll(`[data-stamp="${id}"]`).forEach(b => b.classList.add("just"));
  if (after > before) celebrate(after);
  else toast(`ごちそうさま！ ${byId(id).pudding} にスタンプ（あと${PER_FLOWER - n % PER_FLOWER}店で満開）`);
}
function unstamp(id){ write({ate: {[id]: {[meKey()]: null}}}); refresh(); select(id, false); toast("スタンプを取り消しました"); }
document.addEventListener("click", e => {
  const s = e.target.closest("[data-stamp]"); if (s) { stamp(s.dataset.stamp); return; }
  const w = e.target.closest("[data-want]");
  if (w) { const id = w.dataset.want; write({want: {[id]: isWant(id) ? null : true}}); refresh(); if (activeId === id && !card.hidden) select(id, false); }
});

function updateBloom(){
  const n = ateCount(), petals = n % PER_FLOWER, flowers = Math.floor(n / PER_FLOWER);
  document.getElementById("bloomFlower").innerHTML = flowerSVG(petals === 0 && n > 0 ? 5 : petals);
  document.getElementById("cntAte").textContent = n;
  document.getElementById("cntAll").textContent = all().length;
  document.getElementById("cntFlower").textContent = flowers;
  document.getElementById("tabCount").textContent = n;
  document.getElementById("dots").innerHTML = Array.from({length: PER_FLOWER}, (_, i) => `<i class="${i < petals ? "on" : ""}"></i>`).join("");
  document.getElementById("nextTxt").textContent = `あと${PER_FLOWER - petals}店で${flowers + 1}輪目が満開`;
}

const card = document.getElementById("card");
function select(id, fly){
  const s = byId(id); if (!s) return; activeId = id;
  if (fly) flyTo(s.lon, s.lat, Math.min(view.w, FULL.w / 6));
  const q = encodeURIComponent(`${s.shop} ${s.pref}${s.city.replace(/（.*?）/g, "")}`);
  card.innerHTML = `<button class="close" type="button" aria-label="閉じる">×</button>
    <div class="txt"><h3>${esc(s.pudding)}</h3><p class="shop">${esc(s.shop)}</p><p class="where">${esc(s.pref)} ${esc(s.city)}</p></div>
    <div class="stampcol">${stampHTML(id, true)}${myTs(id) ? `<button type="button" class="linkish" data-undo>取り消す</button>` : ""}</div>
    ${pair && isAte(id) ? `<p class="whoate">${whoAte(id).sort((a, b) => a[1] - b[1]).map(([k, t]) => `${k === uid ? "あなた" : esc(names[k] || "パートナー") + "さん"} ${md(t)}`).join("・")} に食べた</p>` : ""}
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
    ${s.mine ? "" : (dt => `<a class="detail ${dt.found ? "" : "search"}" href="${esc(dt.href)}" target="_blank" rel="noopener"><b>${dt.found ? "詳細ページ" : "詳細ページは未登録"}</b><span>${esc(dt.label)}${dt.found ? "：" + esc(dt.host) : ""} ↗</span></a>`)(detail(s))}
    <div class="row">
      <button type="button" class="btn ${isWant(id) ? "on" : ""}" data-want="${id}">♥ 食べたい</button>
      <a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">地図アプリで開く ↗</a>
      ${s.mine ? `<button type="button" class="linkish" data-del>この推しプリンを削除</button>` : ""}
    </div>`;
  card.hidden = false;
  card.querySelector(".close").onclick = () => { card.hidden = true; activeId = null; refresh(); };
  const confirmTwice = (btn, label, fn) => btn.onclick = () => { if (btn.classList.contains("armed")) fn(); else { btn.classList.add("armed"); btn.textContent = label; } };
  const u = card.querySelector("[data-undo]"); if (u) confirmTwice(u, "本当に取り消す", () => unstamp(id));

  if (d) confirmTwice(d, "本当に削除する", () => { write({mine: {[id]: null}, ate: {[id]: null}, want: {[id]: null}}); card.hidden = true; activeId = null; drawPins(); });
  refresh();
  listEl.querySelector("li.active")?.scrollIntoView({block:"nearest"});
}

  let html = `<section class="garden"><h2>${pair ? "ふたりの" : ""}プリンの花だん</h2><p class="fine">${PER_FLOWER}店スタンプを集めるごとに、花が1輪満開になります。</p><div class="flowers">${figs}</div></section>`;

    const shops = all().filter(s => regionOf(s) === r).sort((a, b) => b.lat - a.lat); if (!shops.length) continue;

  }
  paneBook.innerHTML = html;
  paneBook.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go, true));
}

// ---- ふたりで共有（招待コード） ----
const pairDlg = document.getElementById("pairDlg"), pairBody = document.getElementById("pairBody");
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // 読み間違えやすい 0/O・1/I/L は使わない
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CHARS[b % CODE_CHARS.length]).join("");
const cleanCode = t => t.toUpperCase().replace(/[^A-Z0-9]/g, "");
const clone = o => JSON.parse(JSON.stringify(o || {}));
let unsub = null, pairErr = "", syncNote = "";

function soloAsMine(){                           // ひとりの記録を、自分の名前で共有データに持っていく形にする
  const solo = store.get("purin.v2", {ate:{}, want:{}, mine:{}}), out = {ate:{}, want:{}, mine:{}};
  for (const [id, m] of Object.entries(solo.ate || {})) { const t = (m || {})[SOLO]; if (t) out.ate[id] = {[uid]: t}; }
  for (const [id, v] of Object.entries(solo.want || {})) if (v) out.want[id] = true;
  for (const [id, v] of Object.entries(solo.mine || {})) if (v) out.mine[id] = v;
  return out;
}
async function saveMyPair(code){
  store.set("purin.pair", code);
  try { await db.doc(`data/users/${uid}/profile`).set({pair: code}); } catch {}
}
async function createPair(bring){
  for (let i = 0; i < 5; i++) {
    const code = newCode(), ref = db.doc("pairs/" + code);
    if ((await ref.get()).exists) continue;
    await ref.set({members: {[uid]: Date.now()}, created: Date.now(), ...(bring ? soloAsMine() : {ate:{}, want:{}, mine:{}})});
    await saveMyPair(code); subscribe(code); return;
  }
  throw new Error("code");
}
async function joinPair(code, bring){
  const ref = db.doc("pairs/" + code), snap = await ref.get();
  if (!snap.exists) { pairErr = "この招待コードは見つかりません。文字をもう一度確かめてください。"; return; }
  const active = Object.entries(snap.data().members || {}).filter(([, t]) => t).map(([k]) => k);
  if (!active.includes(uid) && active.length >= 2) { pairErr = "このコードはすでに2人で使われています。"; return; }
  const patch = {members: {[uid]: Date.now()}};
  if (bring) merge(patch, soloAsMine());
  await ref.update(patch);
  await saveMyPair(code); subscribe(code);
  toast("つながりました！ これからはふたりのスタンプ帳です");
}
async function leavePair(){
  // 共有中の記録は、自分のブラウザにひとり用の記録として残す
  const keep = {ate:{}, want: clone(S.want), mine: clone(S.mine)};
  for (const id of Object.keys(S.ate || {})) if (isAte(id)) keep.ate[id] = {[SOLO]: firstTs(id)};
  const ref = pair.ref;
  unsub?.(); unsub = null; pair = null; S = keep; store.set("purin.v2", S);
  store.set("purin.pair", null);
  try { await ref.update({members: {[uid]: null}}); } catch {}
  try { await db.doc(`data/users/${uid}/profile`).set({pair: null}); } catch {}
  drawPins(); renderPair(); toast("共有をやめました。記録はこの端末に残っています");
}
function subscribe(code){
  unsub?.();
  pair = {code, ref: db.doc("pairs/" + code), members: {}, ready: false};
  syncNote = "つないでいます…"; renderPair();
  const timer = setTimeout(() => { syncNote = "共有データにまだ届きません。通信状態を確認してください。"; renderPair(); }, 10000);
  unsub = pair.ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); syncNote = ""; }
    if (!snap.exists || !(snap.data().members || {})[uid]) {     // コードが消えた、または外れた
      if (!snap.metadata.fromCache && pair) { unsub?.(); unsub = null; pair = null; S = loadSolo(); store.set("purin.pair", null); drawPins(); renderPair(); }
      return;
    }
    onPairData(snap.data());
  }, () => { clearTimeout(timer); syncNote = "共有が止まりました。ページを開き直してください。"; renderPair(); });
}
function onPairData(d){
  const prevCount = ateCount(), prevAte = S.ate || {}, wasReady = pair.ready;
  S = {ate: clone(d.ate), want: clone(d.want), mine: clone(d.mine)};
  pair.members = {...(d.members || {})}; pair.ready = true;
  const news = [];
  if (wasReady) for (const [id, m] of Object.entries(S.ate)) for (const [k, t] of Object.entries(m || {})) if (t && k !== uid && !(prevAte[id] || {})[k]) news.push(id);
  drawPins(); if (!card.hidden && activeId) select(activeId, false);
  refreshNames();
  const n = ateCount();
  if (news.length && byId(news[0])) {
    if (Math.floor(n / PER_FLOWER) > Math.floor(prevCount / PER_FLOWER)) celebrate(Math.floor(n / PER_FLOWER));
    else toast(`${partnerName()}さんが ${byId(news[0]).pudding} にスタンプ！`);
  }
}
async function refreshNames(){
  if (!user || !pair) return renderPair();
  const ids = Object.keys(pair.members).filter(k => pair.members[k]);
  const ps = await user.profiles(ids);
  names = {}; pair.avatars = {};
  for (const k of ids) { names[k] = ps[k]?.name || ""; pair.avatars[k] = ps[k]?.avatarUrl || ""; }
  renderPair(); refresh();
}

  if (!db) {
    h += `<p class="pairnote">招待コードでの共有は、このプリンマップをClaude上で開いたとき（サインイン中）に使えます。今は、この端末だけに記録しています。</p>`;
  } else if (pair) {

      <ul class="members" style="margin-top:10px">${Object.keys(pair.members).filter(k => pair.members[k]).map(k => `<li>${pair.avatars?.[k] ? `<img alt="" src="${esc(pair.avatars[k])}">` : ""}${k === uid ? "あなた" : esc(names[k] || "パートナー")}</li>`).join("")}${pid ? "" : `<li>参加待ち…</li>`}</ul>
      ${syncNote ? `<p class="err">${esc(syncNote)}</p>` : ""}
      <div class="pairsec"><p>相手がこのページを開けないときは、ページ右上の「共有」から、相手のメールアドレスを「編集者」として招待してください。</p>
      <div class="row"><button type="button" class="linkish" id="leaveBtn">共有をやめる</button></div></div>`;
  } else if (canWrite === false) {
    h += `<p class="pairnote">共有するには、このページの持ち主に「編集者」として招待してもらう必要があります。今は見るだけのモードです。</p>`;
  } else {
    h += `<p class="pairnote">招待コードを使うと、ふたりで同じスタンプ帳とプリンの花を育てられます。</p>
      <div class="pairsec"><h3>招待する</h3><p>コードを作って、相手に送ります。</p>
        <label class="check"><input type="checkbox" id="bringA" checked> 今のスタンプを持っていく</label>
        <div class="row"><button type="button" class="btn primary" id="createBtn">招待コードを作る</button></div></div>
      <div class="pairsec"><h3>招待コードを入力</h3><p>相手から届いた6文字のコードを入れます。</p>
        <input class="codein" id="codeIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" aria-label="招待コード">
        <label class="check"><input type="checkbox" id="bringB" checked> 今のスタンプも合流させる</label>
        <div class="row"><button type="button" class="btn primary" id="joinBtn">つなぐ</button></div></div>
      ${pairErr ? `<p class="err">${esc(pairErr)}</p>` : ""}`;
  }
  h += `<div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn ghost" id="pairClose">閉じる</button></div>`;
  pairBody.innerHTML = h;
  document.getElementById("pairClose").onclick = () => pairDlg.close();
  const busy = async (b, fn) => { b.disabled = true; pairErr = ""; try { await fn(); } catch { pairErr = "うまくいきませんでした。通信状態を確認して、もう一度お試しください。"; } renderPair(); };
  const cb = document.getElementById("createBtn"); if (cb) cb.onclick = () => busy(cb, () => createPair(document.getElementById("bringA").checked));
  const jb = document.getElementById("joinBtn");
  if (jb) jb.onclick = () => { const code = cleanCode(document.getElementById("codeIn").value);
    if (code.length !== 6) { pairErr = "招待コードは6文字です。"; renderPair(); return; }
    busy(jb, () => joinPair(code, document.getElementById("bringB").checked)); };
  const cp = document.getElementById("copyCode");
  if (cp) cp.onclick = () => navigator.clipboard.writeText(pair.code).then(() => { cp.textContent = "コピーしました"; },
    () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("codeTxt")); getSelection().removeAllRanges(); getSelection().addRange(r); cp.textContent = "選択しました。コピーしてください"; });
  const lb = document.getElementById("leaveBtn");
  if (lb) lb.onclick = () => { if (lb.classList.contains("armed")) leavePair(); else { lb.classList.add("armed"); lb.textContent = "本当にやめる（記録はこの端末に残ります）"; } };
}
document.getElementById("pairBtn").onclick = () => { pairErr = ""; renderPair(); pairDlg.showModal(); };

async function initShare(){
  if (!window.claude?.use) return;                // GitHub Pages などでは、ひとりモードのまま
  const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
  user = u;
  if (!d || !u) return;
  const id = await u.id(); if (!id) return;
  db = d; uid = id; canWrite = await u.can("data.write");
  let code = null;
  try { const p = await db.doc(`data/users/${uid}/profile`).get(); code = p.exists ? p.data().pair : null; } catch {}
  code = code || store.get("purin.pair", null);
  if (code) subscribe(code); else renderPair();
}

// ---- 起動 ----
document.getElementById("q").addEventListener("input", e => { filters.q = e.target.value; refresh(); });
chips("regionChips", ["全国", ...Object.keys(REGIONS)], "region");
chips("tagChips", ["すべて", "まだ食べてない", "♥ 食べたい", "ご当地プリン", "温泉地", "専門店", "喫茶・カフェ", "洋菓子店", "老舗", "道の駅・市場", "マイプリン"], "tag");
drawPins();
renderPair();
initShare();
